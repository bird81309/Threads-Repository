<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Threads Spiral Symbol stylized -->
  <g transform="translate(256, 256) scale(7.5)">
    <!-- Stylized @ and Link Loop -->
    <path d="M-12,-4 C-12,-11 -5,-16 2,-16 C9,-16 16,-11 16,-3 C16,5 10,12 2,12 C-3,12 -7,10 -9,6" 
          fill="none" stroke="#f4f4f5" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-3,3 C-6,3 -8,1 -8,-2 C-8,-5 -6,-7 -3,-7 C0,-7 2,-5 2,-2 C2,1 0,3 -3,3 Z" 
          fill="none" stroke="#f4f4f5" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M2,-2 L2,7" fill="none" stroke="#f4f4f5" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Clean Sparkle / Badge icon at bottom right -->
  <g transform="translate(340, 340)">
    <circle cx="0" cy="0" r="44" fill="#09090b" stroke="#27272a" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="url(#accent)"/>
    <!-- Sparkle / check -->
    <path d="M-12,0 L-4,8 L14,-10" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
